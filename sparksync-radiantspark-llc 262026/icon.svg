<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Space Canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Vibrant Neon Ring: Orange -> Pink -> Purple -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="30%" stop-color="#ff3366" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Star Golden Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc107" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff9800" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Squircle with Neon Border -->
  <rect x="76" y="76" width="360" height="360" rx="96" fill="#090d1e" stroke="url(#ringGrad)" stroke-width="26" filter="url(#bloom)" />

  <!-- Soft Ambient Glow around Center Star -->
  <circle cx="256" cy="256" r="110" fill="url(#starGlow)" />

  <!-- Radiant Spark Four-Point Star -->
  <!-- Center at (256, 256) -->
  <path d="M 256 160 Q 256 256 352 256 Q 256 256 256 352 Q 256 256 160 256 Q 256 256 256 160 Z"
        fill="url(#centerStar)"
        filter="drop-shadow(0 0 16px rgba(245, 158, 11, 0.8))" />

  <!-- Core Diamond Highlight -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.95" />
</svg>
