name: Refresh SparkDeals RSS
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sparkdeals-refresh.yml'
      - 'scripts/sync-sparkdeals.py'
permissions:
  contents: write
concurrency:
  group: sparkdeals-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current RSS listings
        run: python3 scripts/sync-sparkdeals.py
      - name: Publish only the feed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sparkdeals.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SparkDeals RSS listings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
