<!DOCTYPE html>
<html lang="en">
<head>

      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .logo-container img { height: 24px; width: 24px; object-fit: contain; }
    iframe {
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      display: block;
    }
  </style>
